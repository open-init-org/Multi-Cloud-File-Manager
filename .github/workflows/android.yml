name: Android CI

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
      - 'v*'

jobs:
  createArtifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Read Go version from project
      run: echo "GO_VERSION=$(grep -E "^org\.openinit\.multicloudfilemanager\.goVersion=" gradle.properties | cut -d'=' -f2)" >> $GITHUB_ENV
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Set up Go from gradle.properties
      uses: actions/setup-go@v5
      with:
        go-version: '${{env.GO_VERSION}}'
      id: go
    - name: Setup Android SDK/NDK
      uses: android-actions/setup-android@v3
    - name: Install NDK from gradle.properties
      run: |
        NDK_VERSION="$(grep -E "^org\.openinit\.multicloudfilemanager\.ndkVersion=" gradle.properties | cut -d'=' -f2)"
        sdkmanager "ndk;${NDK_VERSION}"
    - name: Build app
      run: ./gradlew assembleOssRelease

    - name: Resolve APK paths for release upload
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        APK_ARM=$(ls app/build/outputs/apk/oss/release/*-oss-armeabi-v7a-release.apk)
        APK_ARM64=$(ls app/build/outputs/apk/oss/release/*-oss-arm64-v8a-release.apk)
        APK_X86=$(ls app/build/outputs/apk/oss/release/*-oss-x86-release.apk)
        APK_X64=$(ls app/build/outputs/apk/oss/release/*-oss-x86_64-release.apk)
        APK_UNIVERSAL=$(ls app/build/outputs/apk/oss/release/*-oss-universal-release.apk)
        echo "APK_ARM=$APK_ARM" >> $GITHUB_ENV
        echo "APK_ARM64=$APK_ARM64" >> $GITHUB_ENV
        echo "APK_X86=$APK_X86" >> $GITHUB_ENV
        echo "APK_X64=$APK_X64" >> $GITHUB_ENV
        echo "APK_UNIVERSAL=$APK_UNIVERSAL" >> $GITHUB_ENV
      shell: bash

    - name: Create GitHub Release and Upload Assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          ${{ env.APK_ARM }}
          ${{ env.APK_ARM64 }}
          ${{ env.APK_X86 }}
          ${{ env.APK_X64 }}
          ${{ env.APK_UNIVERSAL }}

    - name: Upload APK (arm)
      uses: actions/upload-artifact@v4
      with:
        name: multicloudfilemanager-armeabi.apk
        path: ${{ github.workspace }}/app/build/outputs/apk/oss/release/*-oss-armeabi-v7a-release.apk
    - name: Upload APK (arm64)
      uses: actions/upload-artifact@v4
      with:
        name: multicloudfilemanager-arm64.apk
        path: ${{ github.workspace }}/app/build/outputs/apk/oss/release/*-oss-arm64-v8a-release.apk
    - name: Upload APK (x86)
      uses: actions/upload-artifact@v4
      with:
        name: multicloudfilemanager-x86.apk
        path: ${{ github.workspace }}/app/build/outputs/apk/oss/release/*-oss-x86-release.apk
    - name: Upload APK (x64)
      uses: actions/upload-artifact@v4
      with:
        name: multicloudfilemanager-x64.apk
        path: ${{ github.workspace }}/app/build/outputs/apk/oss/release/*-oss-x86_64-release.apk
    - name: Upload APK (universal)
      uses: actions/upload-artifact@v4
      with:
        name: multicloudfilemanager-universal.apk
        path: ${{ github.workspace }}/app/build/outputs/apk/oss/release/*-oss-universal-release.apk
        retention-days: 14