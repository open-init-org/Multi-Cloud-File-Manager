// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlinVersion = '2.0.21'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

ext {
    targetCompatibility = JavaVersion.VERSION_21
    getGitVersionName = { ->
        try {
            def stdout = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'describe', '--tags', '--always'
                standardOutput = stdout
                ignoreExitValue = true
            }
            def gitTag = stdout.toString().trim()
            if (gitTag && !gitTag.isEmpty()) {
                return gitTag.startsWith('v') ? gitTag.substring(1) : gitTag
            }

            def gitHubRefName = System.getenv("GITHUB_REF_NAME")
            if (gitHubRefName && gitHubRefName.trim()) {
                def cleanRef = gitHubRefName.trim()
                return cleanRef.startsWith('v') ? cleanRef.substring(1) : cleanRef
            }
        } catch (Exception ignored) {
            // Fallback if git execution fails
        }
        return "3.0.0-SNAPSHOT"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
